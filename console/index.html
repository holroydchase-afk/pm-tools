<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Console · PM tools</title>
<meta name="description" content="Chase Holroyd's studio console: goals, the call sheet and every product, read hourly from public repos.">
<meta name="robots" content="noindex">
<!-- SEC-C5: everything comes from this site; scripts only from app.js. Inline styles are the page's own CSS and the bar widths. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="icon" href="../favicon.svg">
<link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (SIL OFL 1.1, licenses in fonts/), latin subset only. */
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-400-latin.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-500-latin.woff2) format("woff2")}
/* Studio Console (PMT-M3.2). Look ported from the approved mock: sticky header with tabs, one view at a time. */
:root{
  --bg:#eef1f0; --panel:#ffffff; --sunk:#e4e9e7; --line:#d3dbd8; --fg:#17211f; --muted:#56635f;
  --accent:#1d5c74; --accent-soft:#d9e8ee; --on-accent:#ffffff;
  --ok:#1f7a4a; --ok-soft:#dcefe3; --warn:#9a5b00; --warn-soft:#f6e9d2; --bad:#b03a2e; --bad-soft:#f6dedb;
  --chip:#e9eeec;
  --f-display:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111816; --panel:#18211f; --sunk:#0d1312; --line:#2b3835; --fg:#e4ebe8; --muted:#97a6a1;
  --accent:#6fb6d2; --accent-soft:#1b3440; --on-accent:#0b1a20;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#e2ab52; --warn-soft:#3a2c14; --bad:#ef8a7f; --bad-soft:#3d1e1b; --chip:#22302d; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px 0}
.brand{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none;margin-right:4px}
.brand small{font:500 11.5px var(--f-mono);color:var(--muted);margin-left:8px;letter-spacing:0}
.status{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:400 11.5px var(--f-mono);color:var(--muted)}
.flag{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px}
.stale{flex-basis:100%;margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font:500 13px/1.4 var(--f-body)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:8px 0;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;padding:10px 12px 12px;border-bottom:2px solid transparent;min-height:44px;display:flex;align-items:center;gap:6px}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.count{font:500 11.5px var(--f-mono);background:var(--chip);color:var(--fg);padding:1px 6px;border-radius:999px}
.count.hot{background:var(--accent);color:var(--on-accent)}
.count.warn{background:var(--warn-soft);color:var(--warn)}
main{padding-block:24px 64px}
h1{font:700 26px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance;letter-spacing:-.015em}
h2{font:700 17px/1.3 var(--f-display);margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0 0 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.muted{color:var(--muted)}
.src{font:400 11.5px var(--f-mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:hover{border-color:var(--accent)}
.empty{padding:16px;color:var(--muted);margin:0}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{padding:14px 16px}
.stat b{display:block;font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Call Sheet rows (also the off-goal list) */
.callgroup{display:flex;flex-direction:column}
.callgroup .gh{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px}
.call{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.call .sev{align-self:stretch;border-radius:2px;background:var(--line)}
.call.s1 .sev{background:var(--bad)} .call.s2 .sev{background:var(--warn)} .call.s3 .sev{background:var(--accent)}
.call .what{min-width:0;overflow-wrap:anywhere}
.call .what strong{font-weight:600;display:block}
.call .what strong::first-letter{text-transform:uppercase} /* titles that lost their planning ID */
.call .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.call .why{font-size:13px;color:var(--muted);margin-top:2px}
.small{font-size:13px}
@media (max-width:620px){.call{grid-template-columns:4px minmax(0,1fr)}.call .act{grid-column:2}}

/* Focus */
.effort{display:flex;height:28px;border-radius:6px;overflow:hidden;gap:2px;background:var(--sunk)}
.effort span{display:flex;align-items:center;justify-content:center;font:500 11.5px var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.goal{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.goal .key{width:10px;height:10px;border-radius:2px;flex:none}
.goal .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.goal .bar i{display:block;height:100%}
.goal .big{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.g1{background:#1d5c74}.g2{background:#2f6e53}.g3{background:#7a5aa6}.g4{background:#4a6572}.g0{background:#8a5a12}
</style></head>
<body>
<header class="site">
  <div class="wrap">
    <div class="top">
      <a class="back" href="../">← PM tools</a>
      <div class="brand">Studio Console <small>Staff PM view of the agent team</small></div>
      <div class="status" id="status"><span>Loading the feed…</span></div>
    </div>
    <nav aria-label="Views" id="nav">
      <a href="#focus" data-v="focus">Focus <span class="count warn" id="nOff" hidden></span></a>
      <a href="#calls" data-v="calls">Call Sheet <span class="count hot" id="nCalls" hidden></span></a>
      <a href="#slate" data-v="slate">Build Slate</a>
      <a href="#horizon" data-v="horizon">Horizon Board</a>
      <a href="#agents" data-v="agents">Agent Roster</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<script src="app.js"></script>
</body></html>
