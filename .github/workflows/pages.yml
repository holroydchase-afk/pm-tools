name: Test and deploy demos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Hourly rebuild so the Studio Console feed stays under an hour old (PMT-M3.2).
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
# One queue for every run; never cancel one mid-deploy (SEC-C8).
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (SEC-C6); the tag is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:private
      - run: npm run build
      # Overwrites the sample feed in _site/console/. The Actions token only reads public repos.
      # If it fails, the run fails and the live site keeps its last good feed (the page shows its age).
      - if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run feed
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  e2e:
    # The hourly run only refreshes the feed; the code it ships already passed e2e on its push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04 # Playwright 1.56.1 has no browsers for ubuntu-latest (26.04) yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:e2e
  deploy:
    # !cancelled(): still deploy when e2e was skipped on the schedule, but never after a failure.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
